# Правится на лету: collector перечитывает файл каждый цикл.
# Идея: НЕ вырезать по ключевым словам, а начислять баллы. Ниже порога вакансия не пропадает,
# а лежит в базе как "skipped" — смотри /skipped в боте и возвращай /promote <id>.

poll_seconds: 900
threshold: 6 # score >= threshold -> в очередь. 4 пропускало шум из длинных западных описаний; мало приходит — опусти до 5.

# вес за слово целиком; в заголовке считается x2; отрицательные — понижают, а не режут
keywords:
  # целевая роль (PLAN.md: LLM / AI Engineer)
  "ai engineer": 4
  "llm engineer": 4
  "ml engineer": 3
  llm: 3
  rag: 3
  langchain: 2
  embeddings: 2
  "machine learning": 3
  openai: 1
  agents: 1
  # те же роли по-русски (hh, Telegram): "AI-инженер" не совпадает с "ai engineer"
  "ai-инженер": 4
  "llm-инженер": 4
  "ml-инженер": 3
  "машинного обучения": 3
  "машинное обучение": 3
  нейросети: 2
  нейросетей: 2
  ии: 2
  mlops: 2
  "data scientist": 2
  "data science": 2
  "data engineer": 2
  # backend-фундамент (CV Backend)
  fastapi: 2
  python: 2
  backend: 1
  бэкенд: 1
  asyncio: 1
  golang: 2 # фоновый трек; Go-вакансии проходят порог только с golang в заголовке
  rabbitmq: 1
  kafka: 1
  postgresql: 1
  docker: 1
  microservices: 1
  remote: 1
  удаленно: 1
  удалённо: 1
  worldwide: 1
  anywhere: 1
  # готов к переезду при хороших условиях
  relocation: 2
  "relocation paid": 2
  "visa sponsorship": 2
  релокация: 2
  релокацией: 2
  # западные remote-вакансии, на которые из KZ не податься
  "us only": -3
  "usa only": -3
  "us citizens": -3
  "us citizen": -3
  "security clearance": -3
  "must be located in the us": -3
  # не моё
  php: -3
  wordpress: -3
  "1c": -4
  "1с": -4
  ios: -3
  android: -3
  frontend: -2
  qa: -2
  тестировщик: -2
  sales: -3
  продажи: -3
  продажам: -3
  "product manager": -3
  менеджер: -2
  аналитик: -2
  "manual qa": -3
  тестированию: -2
  # у меня 3 года опыта: стажировки и junior вниз
  стажер: -3
  стажёр: -3
  стажировка: -3
  intern: -3
  internship: -3
  junior: -3

remoteok: true

# открытые API / RSS (sources/boards.py); убери строку, чтобы выключить площадку
boards:
  - remotive # remote, весь мир
  - himalayas # remote, весь мир
  - jobicy # remote, весь мир
  - workingnomads # remote
  - wwr # We Work Remotely
  - jobspresso # remote
  - nodesk # remote
  - hn # Hacker News "Who is hiring?" — сильные компании, remote и релокация
  - arbeitnow # Европа, в основном Германия (релокация)
  - landingjobs # Португалия / Европа, флаг relocation paid
  - getmatch # RU IT-рынок, remote и релокация
  - djinni # Python-вакансии, в основном remote (украинский рынок)

# поисковые запросы для площадок с поиском (himalayas, jobicy)
board_queries: [python, llm, machine learning, ai engineer, fastapi]

habr_queries: # широкий охват: дубли отсекает база, фильтр — скоринг
  - python llm
  - rag
  - fastapi
  - ai engineer
  - backend python
  - machine learning

# нужен app на dev.hh.ru (HH_CLIENT_ID/SECRET в .env), иначе источник выключен
hh:
  texts: ["python llm", "ai engineer", "fastapi backend"]
  areas: [40, 113] # 40 Казахстан, 113 Россия
  period_days: 3

# нужны TG_API_ID/TG_API_HASH в .env и разовый логин; пока пусто — источник выключен
telegram_channels:
  - aitujobs # Daily Jobs IT KZ
  - datajobskz # KZ Jobs Data Science & Engineering
  - itvacancykz # ITvacancy KZ & UZ
  - workitkz # IT Вакансии Казахстан
  - pydevjob # Python jobs (Django, Flask, ...)
  - job_python # Python Job | Вакансии | Стажировки
  - datascienceml_jobs # Data Science Jobs
  - data_secrets_career # Data Secrets | Карьера
  - jobgolang # Вакансии Golang (фоновый трек Go)
  - young_june # Young & Junior - вакансии IT
  - devs_kz # Devs.kz (сообщество, вакансии вперемешку)
  - hrlunapark # западные senior/staff вакансии, релокация в Амстердам/Лондон/NY
  - remote_job_golang # подборки Go remote за сутки
  - Young_and_Yandex # ML-стажировки Яндекса
  - Machinelearning_Jobs # группа; без веб-превью, не проверена
  - datakzgroup # группа; без веб-превью, не проверена
