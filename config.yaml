habr_queries: # широкий охват: дубли отсекает база, фильтр — скоринг
  - python llm
  - rag
  - fastapi
  - ai engineer
  - backend python
  - machine learning

# нужен app на dev.hh.ru (HH_CLIENT_ID/SECRET в .env), иначе источник выключен
hh:
  # широко: hh ищет все слова сразу, "python llm" терял "AI-инженер (Python)"; шум режет скоринг
  texts: ["python", "LLM", "ai engineer", "ИИ инженер", "ml engineer", "machine learning", "data scientist", "golang"]
  areas: [40, 113] # 40 Казахстан, 113 Россия
  period_days: 3

# нужны TG_API_ID/TG_API_HASH в .env и разовый логин; пока пусто — источник выключен
