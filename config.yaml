# Правится на лету: collector перечитывает файл каждый цикл.
# Идея: НЕ вырезать по ключевым словам, а начислять баллы. Ниже порога вакансия не пропадает,
# а лежит в базе как "skipped" — смотри /skipped в боте и возвращай /promote <id>.

poll_seconds: 900
threshold: 4          # score >= threshold -> в очередь. Опусти до 3, если приходит мало.

# вес за слово целиком; в заголовке считается x2; отрицательные — понижают, а не режут
keywords:
  # целевая роль (PLAN.md: LLM / AI Engineer)
  "ai engineer": 4
  "llm engineer": 4
  "ml engineer": 3
  llm: 3
  rag: 3
  langchain: 2
  embeddings: 2
  "machine learning": 2
  openai: 1
  agents: 1
  # backend-фундамент (CV Backend)
  fastapi: 2
  python: 2
  backend: 1
  бэкенд: 1
  asyncio: 1
  golang: 2           # фоновый трек; Go-вакансии проходят порог только с golang в заголовке
  rabbitmq: 1
  kafka: 1
  postgresql: 1
  docker: 1
  microservices: 1
  remote: 1
  удаленно: 1
  удалённо: 1
  # не моё
  php: -3
  wordpress: -3
  "1c": -4
  "1с": -4
  ios: -3
  android: -3
  frontend: -2
  qa: -2
  тестировщик: -2
  sales: -3
  продажи: -3

remoteok: true

habr_queries:        # широкий охват: дубли отсекает база, фильтр — скоринг
  - python llm
  - rag
  - fastapi
  - ai engineer
  - backend python
  - machine learning

# нужен app на dev.hh.ru (HH_CLIENT_ID/SECRET в .env), иначе источник выключен
hh:
  texts: ["python llm", "ai engineer", "fastapi backend"]
  areas: [40, 113]   # 40 Казахстан, 113 Россия
  period_days: 3

# нужны TG_API_ID/TG_API_HASH в .env и разовый логин; пока пусто — источник выключен
telegram_channels:
  - aitujobs              # Daily Jobs IT KZ
  - datajobskz            # KZ Jobs Data Science & Engineering
  - itvacancykz           # ITvacancy KZ & UZ
  - workitkz              # IT Вакансии Казахстан
  - pydevjob              # Python jobs (Django, Flask, ...)
  - job_python            # Python Job | Вакансии | Стажировки
  - datascienceml_jobs    # Data Science Jobs
  - data_secrets_career   # Data Secrets | Карьера
  - jobgolang             # Вакансии Golang (фоновый трек Go)
  - young_june            # Young & Junior - вакансии IT
  - devs_kz               # Devs.kz (сообщество, вакансии вперемешку)
  - Machinelearning_Jobs  # группа; без веб-превью, не проверена
  - datakzgroup           # группа; без веб-превью, не проверена
