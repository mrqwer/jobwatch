[project]
name = "jobwatch"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "aio-pika>=9.4",
    "aiogram>=3.13",
    "httpx>=0.27",
    "telethon>=1.36",
    "pyyaml>=6",
]

[dependency-groups]
dev = ["pytest>=8"]

[tool.uv]
package = false

[tool.pytest.ini_options]
pythonpath = ["."]
