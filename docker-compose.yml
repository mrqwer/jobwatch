x-app: &app
  build: .
  restart: unless-stopped
  env_file: .env
  environment:
    AMQP_URL: amqp://jobwatch:${RABBITMQ_PASS}@rabbitmq/
    DB_PATH: /data/jobwatch.db
    TG_SESSION: /data/tg
    CONFIG_PATH: /conf/config.yaml
  volumes:
    - ./data:/data
    # the directory, not the file: git pull / editors replace config.yaml with a new file,
    # and a single-file mount keeps showing the old one until the container is recreated
    - .:/conf:ro
  depends_on:
    rabbitmq:
      condition: service_healthy

services:
  rabbitmq:
    image: rabbitmq:4-management
    hostname: rabbitmq # data is stored per node name rabbit@<hostname>; a random one loses the queue on every recreate
    restart: unless-stopped
    environment:
      RABBITMQ_DEFAULT_USER: jobwatch # "guest" is refused from other containers
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASS}
    ports:
      - "127.0.0.1:16000:15672" # management UI, reach it over an ssh tunnel
    volumes:
      - rabbitmq:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 10s
      retries: 10

  collector:
    <<: *app
    command: python -m jobwatch.collect

  bot:
    <<: *app
    command: python -m jobwatch.bot

volumes:
  rabbitmq:
